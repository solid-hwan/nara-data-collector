[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nara-data-mcp"
version = "0.5.1"
description = "나라장터 데이터 수집기 — 공고·발주계획 검색과 수집"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SIONLAB"}]
readme = "README.md"
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0"]

[project.scripts]
nara-data-mcp = "sionlab_procurement.cli:main"
sionlab-procurement = "sionlab_procurement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sionlab_procurement = ["*.json"]
