[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sionlab-procurement-mcp"
version = "0.4.0"
description = "SIONLAB procurement search and resumable collection over official Korean public APIs"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SIONLAB"}]
readme = "README.md"
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0"]

[project.scripts]
sionlab-procurement = "sionlab_procurement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sionlab_procurement = ["*.json"]
